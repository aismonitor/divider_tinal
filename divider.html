<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Divider — EIS executions</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <a class="back-link" href="index.html" data-i18n="backHome">← Tools</a>
          <h1>Divider</h1>
        </div>
        <label class="lang-picker">
          <span class="lang-label" data-i18n="langLabel">Language</span>
          <select id="langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
        </label>
      </div>
      <p class="tagline" data-i18n="tagline">Split EIS export.xml into one contractProcedure per execution</p>
    </header>

    <section class="panel">
      <label class="file-label">
        <span class="file-btn" data-i18n="chooseFile">Choose XML / ZIP</span>
        <input id="fileInput" type="file" accept=".xml,.zip,application/xml,text/xml,application/zip" />
      </label>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="summary" class="summary" hidden>
      <dl>
        <div>
          <dt data-i18n="schemeVersion">Contract scheme version</dt>
          <dd id="schemeVersion">—</dd>
        </div>
        <div>
          <dt data-i18n="executionsFound">Executions found</dt>
          <dd id="execCount">0</dd>
        </div>
        <div>
          <dt data-i18n="contractRegNum">Contract registry number</dt>
          <dd id="regNum">—</dd>
        </div>
      </dl>
    </section>

    <section id="results" class="results" hidden>
      <p id="parsedLine" class="parsed-line"></p>
      <p id="contractLine" class="contract-line"></p>
      <p id="foundLine" class="found-line"></p>
      <p class="list-hint" data-i18n="listHint">Click a row to open its XML in a new tab</p>

      <label class="select-all">
        <input id="selectAll" type="checkbox" checked />
        <span id="selectAllLabel" data-i18n="selectAll">Select all</span>
      </label>

      <div class="exec-table">
        <div id="execHead" class="exec-row exec-head" hidden>
          <span class="exec-num" data-i18n="colOrdinal">#</span>
          <span class="exec-docnum" data-i18n="colDocumentNum">Doc. №</span>
          <span class="exec-sid" data-i18n="colSid">SID</span>
          <span class="exec-paid" data-i18n="colPaid">Paid</span>
          <span class="exec-name" data-i18n="colName">Name</span>
          <span class="exec-date" data-i18n="colDate">Date</span>
          <span class="exec-check" aria-hidden="true"></span>
        </div>
        <ul id="execList" class="exec-list"></ul>
      </div>

      <button id="exportBtn" type="button" class="export-btn" disabled>
        Export selected
      </button>
    </section>
  </main>

  <script src="vendor/jszip.min.js"></script>
  <script src="divider.js"></script>
</body>
</html>
