server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # HTML always revalidated so VDS updates show up after rebuild.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Remote git update API (updater sidecar; requires UPDATE_TOKEN).
    location /api/ {
        proxy_pass http://updater:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/xml text/plain;
}
