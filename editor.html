<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor — XML</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app editor-app">
    <header class="header">
      <div class="header-top">
        <div class="header-brand">
          <a class="back-link" href="index.html" data-i18n="backHome">← Tools</a>
          <h1>Editor</h1>
        </div>
        <label class="lang-picker">
          <span class="lang-label" data-i18n="langLabel">Language</span>
          <select id="langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
        </label>
      </div>
      <p class="tagline" data-i18n="tagline">Import XML, edit data in a table, download the result</p>
    </header>

    <section class="panel editor-toolbar">
      <label class="file-label">
        <span class="file-btn" data-i18n="chooseFile">Import XML</span>
        <input id="fileInput" type="file" accept=".xml,application/xml,text/xml" />
      </label>
      <div class="editor-actions" id="editorActions" hidden>
        <button type="button" id="expandAllBtn" class="ghost-btn" data-i18n="expandAll">Expand all</button>
        <button type="button" id="collapseEmptyBtn" class="ghost-btn" data-i18n="collapseEmpty">Collapse empty</button>
        <button type="button" id="downloadBtn" class="export-btn" data-i18n="download">Download XML</button>
      </div>
      <div class="field-filter" id="fieldFilterWrap" hidden>
        <label class="field-filter-label" for="fieldFilter" data-i18n="fieldFilterLabel">Filter</label>
        <input
          id="fieldFilter"
          name="fieldFilter"
          type="text"
          data-i18n-placeholder="fieldFilter"
          placeholder="Filter fields…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="meta" class="summary editor-meta" hidden>
      <dl>
        <div>
          <dt data-i18n="fileName">File</dt>
          <dd id="fileName">—</dd>
        </div>
        <div>
          <dt data-i18n="rootName">Document</dt>
          <dd id="rootName">—</dd>
        </div>
        <div>
          <dt data-i18n="fieldCount">Fields</dt>
          <dd id="fieldCount">0</dd>
        </div>
      </dl>
    </section>

    <section id="tablePanel" class="results table-panel" hidden>
      <p class="list-hint" data-i18n="tableHint">All fields are listed. Filter by purchaseObjectsInfo (or any name) to jump to a block.</p>
      <div class="data-table-wrap">
        <table class="data-table" id="dataTable">
          <thead>
            <tr>
              <th class="col-field" data-i18n="colField">Field</th>
              <th class="col-value" data-i18n="colValue">Value</th>
            </tr>
          </thead>
          <tbody id="dataBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="editor.js"></script>
</body>
</html>
