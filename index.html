<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Divider tools</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app home">
    <header class="header">
      <div class="header-top">
        <h1>Divider tools</h1>
        <label class="lang-picker">
          <span class="lang-label" data-i18n="langLabel">Language</span>
          <select id="langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
        </label>
      </div>
      <p class="tagline" data-i18n="tagline">EIS XML utilities — split executions or edit documents</p>
    </header>

    <nav class="tool-nav" aria-label="Tools">
      <a class="tool-card" href="divider.html">
        <span class="tool-card-title" data-i18n="dividerTitle">Divider</span>
        <span class="tool-card-desc" data-i18n="dividerDesc">Import export.xml and split into one contractProcedure per execution</span>
      </a>
      <a class="tool-card" href="editor.html">
        <span class="tool-card-title" data-i18n="editorTitle">Editor</span>
        <span class="tool-card-desc" data-i18n="editorDesc">Import XML, browse and edit the tree, download the result</span>
      </a>
    </nav>
  </main>

  <script src="home.js"></script>
</body>
</html>
