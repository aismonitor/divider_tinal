<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Divider tools</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app home">
    <header class="header">
      <div class="header-top">
        <h1>Divider tools</h1>
        <label class="lang-picker">
          <span class="lang-label" data-i18n="langLabel">Language</span>
          <select id="langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
        </label>
      </div>
      <p class="tagline" data-i18n="tagline">EIS XML utilities — split executions or edit documents</p>
    </header>

    <nav class="tool-nav" aria-label="Tools">
      <a class="tool-card" href="divider.html">
        <span class="tool-card-title" data-i18n="dividerTitle">Divider</span>
        <span class="tool-card-desc" data-i18n="dividerDesc">Import export.xml and split into one contractProcedure per execution</span>
      </a>
      <a class="tool-card" href="editor.html">
        <span class="tool-card-title" data-i18n="editorTitle">Editor</span>
        <span class="tool-card-desc" data-i18n="editorDesc">Import XML, browse and edit the tree, download the result</span>
      </a>
    </nav>

    <section class="vds-update panel" aria-label="Server update">
      <div class="vds-update-row">
        <div class="vds-update-copy">
          <h2 class="vds-update-title" data-i18n="updateTitle">Server</h2>
          <p class="vds-update-desc" data-i18n="updateDesc">Pull the latest code from git and rebuild this VDS deployment.</p>
        </div>
        <button type="button" id="updateFromGitBtn" class="ghost-btn" data-i18n="updateBtn">Update from git</button>
      </div>
      <p id="updateStatus" class="vds-update-status" hidden></p>
    </section>
  </main>

  <script src="home.js"></script>
</body>
</html>
